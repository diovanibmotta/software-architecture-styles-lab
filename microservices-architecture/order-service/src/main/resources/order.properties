spring.application.name=order-service
server.port=${PORT:8082}
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:order-schema.sql
catalog.url=${CATALOG_URL:http://localhost:8081}
payment.url=${PAYMENT_URL:http://localhost:8083}
delivery.url=${DELIVERY_URL:http://localhost:8084}
# resilience: per-call timeout and circuit breaker (Resilience4j)
resilience.timeout-ms=${RESILIENCE_TIMEOUT_MS:1000}
resilience.window=${RESILIENCE_WINDOW:6}
resilience.min-calls=${RESILIENCE_MIN_CALLS:3}
resilience.failure-rate=${RESILIENCE_FAILURE_RATE:50}
resilience.open-ms=${RESILIENCE_OPEN_MS:5000}
outbox.interval-ms=${OUTBOX_INTERVAL_MS:300}
