spring.application.name=delivery-service
server.port=${PORT:8084}
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:delivery-schema.sql
# demo rule: how many deliveries can be in progress at once (couriers on shift)
delivery.couriers=${DELIVERY_COURIERS:2}
# where the order-service listens for delivery outcomes (async callback)
order.url=${ORDER_URL:http://localhost:8082}
