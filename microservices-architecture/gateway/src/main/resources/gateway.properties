spring.application.name=gateway
server.port=${PORT:8080}
# /api/{route}/... is forwarded to the service behind {route}. Callbacks such as /orders/{id}/delivery are internal: in production they must not be exposed (see docs/04).
gateway.routes.catalog=${CATALOG_URL:http://localhost:8081}
gateway.routes.orders=${ORDER_URL:http://localhost:8082}
gateway.routes.payments=${PAYMENT_URL:http://localhost:8083}
gateway.routes.deliveries=${DELIVERY_URL:http://localhost:8084}
gateway.timeout-ms=${GATEWAY_TIMEOUT_MS:3000}
