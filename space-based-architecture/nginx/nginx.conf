events {}

http {
    # Messaging grid (simplified): spreads incoming requests across the processing units.
    upstream processing_units {
        least_conn;
        server pu-1:8080 max_fails=2 fail_timeout=5s;
        server pu-2:8080 max_fails=2 fail_timeout=5s;
        server pu-3:8080 max_fails=2 fail_timeout=5s;
    }

    server {
        listen 80;
        location / {
            proxy_pass http://processing_units;
            proxy_next_upstream error timeout http_502 http_503;
        }
    }
}
