events {}

http {
    # Single entry point (the "API layer" of the book). Routes by path to the owning domain service.
    server {
        listen 80;
        resolver 127.0.0.11 valid=5s;

        location /products { set $u http://catalog-service:8080; proxy_pass $u; }
        location /orders   { set $u http://order-service:8080;   proxy_pass $u; }
        location /payments { set $u http://billing-service:8080; proxy_pass $u; }
        location /invoices { set $u http://billing-service:8080; proxy_pass $u; }
    }
}
