# Service-based topology: API gateway -> 3 coarse-grained domain services -> ONE shared PostgreSQL.
x-service-env: &service-env
  DB_URL: jdbc:postgresql://postgres:5432/shop
  DB_USER: shop
  DB_PASSWORD: shop
  SQL_INIT: never          # schema is created once by postgres (mounted below), not by 3 racing services
  PORT: "8080"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
    volumes:
      - ./shared-persistence/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop"]
      interval: 3s
      retries: 20

  catalog-service:
    build: { context: ., args: { MODULE: catalog-service } }
    environment: *service-env
    depends_on:
      postgres: { condition: service_healthy }

  order-service:
    build: { context: ., args: { MODULE: order-service } }
    environment: *service-env
    depends_on:
      postgres: { condition: service_healthy }

  billing-service:
    build: { context: ., args: { MODULE: billing-service } }
    environment: *service-env
    depends_on:
      postgres: { condition: service_healthy }

  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports: ["8084:80"]   # 8084 so it can run next to the other examples (8080/8081)
    depends_on: [catalog-service, order-service, billing-service]
